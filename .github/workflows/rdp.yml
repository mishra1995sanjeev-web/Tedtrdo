name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download and Setup Ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/b31rt1xmfv/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip
          ./ngrok/ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Enable RDP Access
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Create RDP User
        run: |
          net user AdminUser Password12345! /add
          net localgroup administrators AdminUser /add

      - name: Start Ngrok Tunnel
        run: |
          Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 10
          $response = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels
          $public_url = $response.tunnels[0].public_url
          Write-Host "=========================================="
          Write-Host "RDP Address: $public_url"
          Write-Host "Username: AdminUser"
          Write-Host "Password: Password12345!"
          Write-Host "=========================================="

      - name: Keep Alive Loop
        run: |
          $i = 0
          while ($i -lt 360) {
              Start-Sleep -Seconds 60
              $i++
          }
          
